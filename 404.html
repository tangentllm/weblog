  return typeof siteMeta.siteBasePath === 'string' ? siteMeta.siteBasePath : '';

/** Runtime base path: follows the URL (local root serve vs GitHub Pages /weblog). */
function getSiteBasePath() {
  const p = location.pathname || '/';
  const fromUrl = p === '/weblog' || p.startsWith('/weblog/') ? '/weblog' : '';
  if (fromUrl) return fromUrl;
  if (/^localhost$|^127\.0\.0\.1$/i.test(location.hostname)) return '';
  const configured = getDeployBasePath();
  if (configured && (p === configured || p.startsWith(`${configured}/`))) return configured;
  return '';
}

const JOSH_ROUTE_ALIASES = {
  category: {
    '论文精读': '论文解读',
  },
};

function normalizeRouteSegment(type, value) {
  if (!value) return value;
  let decoded = value;
  try {
    decoded = decodeURIComponent(value);
  } catch {
    decoded = value;
  }
  if (type === 'category' && JOSH_ROUTE_ALIASES.category[decoded]) {
    return JOSH_ROUTE_ALIASES.category[decoded];
  }
  return decoded;
}

function sitePath(subpath = '') {
  const base = getSiteBasePath();
  const tail = String(subpath || '').replace(/^\//, '');
  if (!tail) return base ? `${base}/` : '/';
  return `${base}/${tail}`;
}

function absolutePageUrl(subpath = '') {
  const p = sitePath(subpath);
  const normalized = p.startsWith('/') ? p : `/${p}`;
  return `${SITE_ORIGIN}${normalized}`;
}

const Routes = {
  home: () => sitePath(),

  postPublic: (slug) => sitePath(`post/${encodeURIComponent(slug)}`),
  categories: () => sitePath('categories'),
  category: (name) => sitePath(`category/${encodeURIComponent(name)}`),
  tags: () => sitePath('tags'),
  tag: (tag) => sitePath(`tag/${encodeURIComponent(tag)}`),
  projects: (query = '') => {
    const base = sitePath('projects');
    return query ? `${base}?${query}` : base;
  },
  project: (slug) => sitePath(`project/${encodeURIComponent(slug)}`),
  about: () => sitePath('about'),
};

function hashRouteToPath(hash) {
  const hashPath = (hash || '').split('?')[0];
  if (hashPath === '#/' || hashPath === '#' || hashPath === '') return '';
  if (hashPath.startsWith('#/post/')) return `post/${decodeURIComponent(hashPath.slice('#/post/'.length))}`;
  if (hashPath === '#/categories') return 'categories';
  if (hashPath.startsWith('#/category/')) return `category/${decodeURIComponent(hashPath.slice('#/category/'.length))}`;
  if (hashPath === '#/tags') return 'tags';
  if (hashPath.startsWith('#/tag/')) return `tag/${decodeURIComponent(hashPath.slice('#/tag/'.length))}`;
  if (hashPath === '#/projects') return 'projects';
  if (hashPath.startsWith('#/project/')) return `project/${decodeURIComponent(hashPath.slice('#/project/'.length))}`;
  if (hashPath === '#/about') return 'about';
  return null;
}

function migrateHashToHistory() {
  const hash = location.hash || '';
  if (!hash.startsWith('#/')) return;
  const mapped = hashRouteToPath(hash);
  if (mapped === null) return;
  const qs = hash.includes('?') ? `?${hash.split('?').slice(1).join('?')}` : '';
  history.replaceState(null, '', sitePath(mapped) + qs);
}

function parseRoute() {
  let path = location.pathname || '/';
  const base = getSiteBasePath();
  if (base && path.startsWith(base)) path = path.slice(base.length) || '/';
  path = path.replace(/\/index\.html$/i, '') || '/';
  if (!path.startsWith('/')) path = `/${path}`;
  if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
  const query = new URLSearchParams(location.search || '');

  if (path === '/' || path === '') {
    const view = query.get('view');
    const slug = query.get('slug');
    if (view === 'post' && slug) return { type: 'post', slug: decodeURIComponent(slug), query };
    if (view === 'project' && slug) return { type: 'project', slug: decodeURIComponent(slug), query };
    return { type: 'home', query };
  }
  const postMatch = path.match(/^\/post\/([^/]+)$/);
  if (postMatch) return { type: 'post', slug: decodeURIComponent(postMatch[1]), query };
  if (path === '/categories') return { type: 'categories', query };
  const catMatch = path.match(/^\/category\/([^/]+)$/);
  if (catMatch) return { type: 'category', name: normalizeRouteSegment('category', catMatch[1]), query };
  if (path === '/tags') return { type: 'tags', query };
  const tagMatch = path.match(/^\/tag\/([^/]+)$/);
  if (tagMatch) return { type: 'tag', tag: normalizeRouteSegment('tag', tagMatch[1]), query };
  if (path === '/projects') return { type: 'projects', query };
  const projMatch = path.match(/^\/project\/([^/]+)$/);
  if (projMatch) return { type: 'project', slug: decodeURIComponent(projMatch[1]), query };
  if (path === '/about') return { type: 'about', query };
  return { type: '404', query };
}

function applySiteVerificationMeta() {

function normalizeSkillToken(value) {
  return String(value || '')
    .toLowerCase()
    .replace(/[（()）\s\-_/]/g, '')
    .replace(/[^a-z0-9\u4e00-\u9fa5]/g, '');
}

function buildCoveredSkillSet() {
  const allTags = [
    ...posts.flatMap((post) => post.tags || []),
    ...projectsData.flatMap((project) => project.tags || []),
  ];
  const normalizedTags = allTags.map(normalizeSkillToken).filter(Boolean);
  const covered = new Set(normalizedTags);
  const aliasMap = {
    rag: ['检索增强生成', '向量数据库', '检索生成流程'],
    sft: ['sft监督微调', '指令微调'],
    rlhf: ['rlhf人类反馈强化学习'],
    dpo: ['模型迭代优化'],
    promptops: ['提示优化'],
    multiagent: ['multiagent系统', '协同工作流'],
    abtest: ['ab测试'],
    pytorch: ['pytorch'],
    langchain: ['langchain'],
    llamaindex: ['llamaindex'],
    functioncall: ['functioncall', 'functioncalling', 'function call', 'tool calling'],
    mcp: ['mcp', 'mcp协议', 'mcpserver', 'mcp server'],
    skill: ['skill', 'skills', 'agentskill', 'agent skill', 'cursorskills', 'cursor skills'],
    toolcalling: ['toolcalling', 'tool calling', 'function calling'],
    deepspeed: ['deepspeed'],
    peft: ['peft'],
    accelerate: ['accelerate'],
    bitsandbytes: ['bitsandbytes'],
  };
  normalizedTags.forEach((tag) => {
    Object.entries(aliasMap).forEach(([alias, linkedSkills]) => {
      if (tag.includes(normalizeSkillToken(alias))) {
        linkedSkills.forEach((skill) => covered.add(normalizeSkillToken(skill)));
      }
    });
  });
  return { covered, normalizedTags };
}

function isSkillCovered(skillLabel, coveredInfo) {
  const normalizedSkill = normalizeSkillToken(skillLabel);
  if (!normalizedSkill) return false;
  if (coveredInfo.covered.has(normalizedSkill)) return true;
  return coveredInfo.normalizedTags.some(
    (tag) => tag.includes(normalizedSkill) || normalizedSkill.includes(tag),
  );
}

function findTagForSkill(skillLabel, coveredInfo) {
  const normalizedSkill = normalizeSkillToken(skillLabel);
  if (!normalizedSkill || !isSkillCovered(skillLabel, coveredInfo)) return null;
  const tags = [...new Set(posts.flatMap((post) => post.tags || []))];
  let best = null;
  let bestScore = 0;
  tags.forEach((tag) => {
    const normalizedTag = normalizeSkillToken(tag);
    if (!normalizedTag) return;
    let score = 0;
    if (normalizedTag === normalizedSkill) score = 100;
    else if (normalizedTag.includes(normalizedSkill) || normalizedSkill.includes(normalizedTag)) {
      score = 60 - Math.abs(normalizedTag.length - normalizedSkill.length);
    }
    if (score > bestScore) {
      bestScore = score;
      best = tag;
    }
  });
  return best;
}

  return skillStackSections.map((section) => `

function renderAboutSkillStack() {
  const coveredInfo = buildCoveredSkillSet();
  const quickTagMap = new Map();
  skillStackSections.forEach((section) => {
    section.skills.forEach((skill) => {
      const tag = findTagForSkill(skill, coveredInfo);
      if (tag && !quickTagMap.has(tag)) quickTagMap.set(tag, skill);
    });
  });
  const quickLinksHtml = quickTagMap.size
    ? `<div class="josh-about-skill-quick">
        <p class="josh-about-skill-quick__label">博客已覆盖（${quickTagMap.size}）</p>
        <div class="josh-skill-pills">

          )).join('')}

    : '';

  const accordionHtml = skillStackSections.map((section) => {
    const coveredCount = section.skills.filter((skill) => findTagForSkill(skill, coveredInfo)).length;
    return `<details class="josh-skill-details">

  }).join('');

  return `${quickLinksHtml}<div class="josh-skill-accordion">${accordionHtml}</div>`;
}

function stripFrontmatter(markdownText) {
  const normalizedText = (markdownText || '').replace(/^\uFEFF/, '');
  if (!normalizedText.startsWith('---')) return normalizedText;
  const matched = normalizedText.match(/^---[\s\S]*?---\s*/);
  return matched ? normalizedText.slice(matched[0].length) : normalizedText;
}

function parsePostFrontmatter(markdownText) {
  const normalizedText = (markdownText || '').replace(/^\uFEFF/, '');
  const match = normalizedText.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (!match) return {};
  const data = {};
  match[1].split(/\r?\n/).forEach((rawLine) => {
    const line = rawLine.trim();
    if (!line || !line.includes(':')) return;
    const [key, ...rest] = line.split(':');
    data[key.trim()] = rest.join(':').trim();
  });
  return data;
}

/** 按原文档高度自适应 iframe，保持与独立打开 mcp_kw.html 相同的排版 */
function initHtmlArticleFrame(scope) {
  const frame = scope?.querySelector('.html-article-frame');
  if (!frame) return;

  let resizeObserver = null;
  const errorEl = scope.querySelector('.html-article-frame-error');

  const fitHeight = () => {
    try {
      const doc = frame.contentDocument;
      if (!doc) return;
      const height = Math.max(
        doc.documentElement?.scrollHeight || 0,
        doc.body?.scrollHeight || 0,
        480,
      );
      frame.style.height = `${height}px`;
    } catch (_) {
      /* 跨域时无法读高度，保留 min-height */
    }
  };

  const onLoad = () => {
    try {
      const doc = frame.contentDocument;
      const ok = Boolean(doc?.querySelector('.wrap, .container'));
      if (!ok) {
        frame.classList.add('hidden');
        errorEl?.classList.remove('hidden');
        return;
      }
      errorEl?.classList.add('hidden');
      frame.classList.remove('hidden');
      fitHeight();
      if (typeof ResizeObserver !== 'undefined' && doc.body) {
        resizeObserver?.disconnect();
        resizeObserver = new ResizeObserver(fitHeight);
        resizeObserver.observe(doc.documentElement);
        resizeObserver.observe(doc.body);
      }
    } catch (_) {
      fitHeight();
    }
  };

  frame.addEventListener('load', onLoad);
  window.addEventListener('resize', fitHeight);
}

// 阅读进度保存和恢复
let joshReadingProgressCleanup = null;

function clearJoshReadingProgress() {
  if (typeof joshReadingProgressCleanup === 'function') {
    joshReadingProgressCleanup();
    joshReadingProgressCleanup = null;
  }
}

function bindJoshReadingProgress(slug) {
  clearJoshReadingProgress();
  if (!slug) return;
  if (typeof restoreReadingProgress === 'function') {
    restoreReadingProgress(slug);
  }
  if (typeof initReadingProgressTracking === 'function') {
    joshReadingProgressCleanup = initReadingProgressTracking(slug);
  }
}

function saveReadingProgress(slug) {
  const scrollPosition = window.scrollY;
  const progress = {
    slug: slug,
    position: scrollPosition,
    timestamp: Date.now()
  };
  localStorage.setItem(`reading_progress_${slug}`, JSON.stringify(progress));
}

function restoreReadingProgress(slug) {
  const saved = localStorage.getItem(`reading_progress_${slug}`);
  if (!saved) return;

  try {
    const progress = JSON.parse(saved);
    // 只恢复7天内的阅读进度
    const daysSince = (Date.now() - progress.timestamp) / (1000 * 60 * 60 * 24);
    if (daysSince > 7) {
      localStorage.removeItem(`reading_progress_${slug}`);
      return;
    }

    // 延迟恢复滚动位置，确保内容已渲染
    setTimeout(() => {
      if (progress.position < 80) return;
      window.scrollTo({
        top: progress.position,
        behavior: 'instant',
      });
    }, 100);
  } catch (e) {
    console.error('Failed to restore reading progress:', e);
  }
}

function initReadingProgressTracking(slug) {
  let saveTimer;
  const handleScroll = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveReadingProgress(slug);
    }, 1000); // 1秒后保存
  };

  window.addEventListener('scroll', handleScroll);

  // 页面卸载时保存
  const cleanup = () => {
    window.removeEventListener('scroll', handleScroll);
    saveReadingProgress(slug);
  };

  return cleanup;
}

function estimateReadTimeFromMarkdown(markdownText) {
  const plainText = (markdownText || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`[^`]*`/g, ' ')
    .replace(/!\[[^\]]*\]\([^)]+\)/g, ' ')
    .replace(/\[[^\]]*\]\([^)]+\)/g, ' ')
    .replace(/[^\u4e00-\u9fa5A-Za-z0-9\s]/g, ' ');
  const tokens = plainText.trim().split(/\s+/).filter(Boolean).length;
  const minutes = Math.max(3, Math.ceil(tokens / 220));
  return `${minutes} min`;
}

function buildExcerptFromMarkdown(markdownText) {
  const noCode = (markdownText || '').replace(/```[\s\S]*?```/g, ' ');
  const plain = noCode
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/>\s?/g, '')
    .replace(/[*_`~\-]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  return plain.slice(0, 92) + (plain.length > 92 ? '...' : '');
}

/** 分享/Open Graph 用的绝对图址；data: 内联封面无法被社交平台抓取，退回默认 og 图 */
function coverUrlForOpenGraph(cover, baseUrl) {
  const b = typeof baseUrl === 'string' ? baseUrl : '';
  const fallback = `${b}og-image.png`;
  if (!cover || typeof cover !== 'string') return fallback;
  const c = cover.trim();
  if (!c || c.startsWith('data:')) return fallback;
  if (/^https?:\/\//i.test(c)) return c;
  return b + c.replace(/^\.\//, '');
}

function rootBasePathPrefix() {
  const pathname = window.location.pathname || '/';
  let basePath = pathname.endsWith('/index.html')
    ? pathname.slice(0, -'/index.html'.length)
    : pathname.endsWith('/')
      ? pathname
      : `${pathname}/`;
  if (!basePath.endsWith('/')) basePath += '/';
  return basePath;
}

function resolveAssetUrl(inputUrl) {
  const raw = String(inputUrl || '').trim();
  if (!raw) return raw;
  if (/^(https?:|data:|blob:)/i.test(raw)) return raw;
  const cleaned = raw.replace(/^\.\//, '');
  try {
    if (window.location.protocol === 'file:') {
      const decodedPath = decodeURIComponent(window.location.pathname || '');
      const normalizedCurrent = decodedPath.replace(/\\/g, '/');
      const currentDir = normalizedCurrent.endsWith('/index.html')
        ? normalizedCurrent.slice(0, -'/index.html'.length)
        : normalizedCurrent.replace(/\/[^/]*$/, '');
      const targetPath = `${currentDir}/${cleaned.replace(/^\/+/, '')}`
        .replace(/\/{2,}/g, '/');
      return `file://${targetPath.startsWith('/') ? '' : '/'}${targetPath}`;
    }

    if (cleaned.startsWith('/')) {
      return new URL(cleaned, window.location.origin).toString();
    }

    // 静态资源始终相对站点根（/weblog/），勿用当前文章路径 /weblog/post/slug/
    const siteBase = getSiteBasePath();
    const prefix = siteBase ? `${siteBase}/` : '/';
    const rel = cleaned.replace(/^\/+/, '');
    return new URL(`${prefix}${rel}`, window.location.origin).toString();
  } catch {
    return raw;
  }
}

function buildImageUrlCandidates(inputUrl) {
  const raw = String(inputUrl || '').trim();
  if (!raw) return [];
  if (/^(data:|blob:|file:)/i.test(raw)) return [raw];

  if (/^https?:/i.test(raw)) {
    const candidates = new Set([raw]);
    try {
      const siteBase = getSiteBasePath();
      const url = new URL(raw);
      const baseNoSlash = siteBase ? siteBase.replace(/^\//, '') : '';
      const marker = baseNoSlash ? `/${baseNoSlash}/` : '';
      if (marker && url.pathname.startsWith(marker)) {
        const rootPath = url.pathname.slice(marker.length - 1);
        candidates.add(`${url.origin}${rootPath}`);
      }
    } catch {
      /* ignore malformed absolute url */
    }
    return Array.from(candidates);
  }

  const cleaned = raw.replace(/^\.\//, '');
  const candidates = new Set();

  const push = (value) => {
    if (value && typeof value === 'string') candidates.add(value);
  };

  const resolved = resolveAssetUrl(raw);
  push(resolved);

  const siteBase = getSiteBasePath();
  const baseNoSlash = siteBase ? siteBase.replace(/^\//, '') : '';
  const rel = cleaned.replace(/^\/+/, '');
  const rootCandidate = new URL(`/${rel}`, window.location.origin).toString();
  const prefix = siteBase ? `${siteBase}/` : '/';
  const prefixedCandidate = new URL(`${prefix}${rel}`, window.location.origin).toString();

  if (baseNoSlash && rel.startsWith(`${baseNoSlash}/`)) {
    push(rootCandidate);
    return Array.from(candidates);
  }

  push(prefixedCandidate);
  if (siteBase) {
    push(rootCandidate);
  } else {
    push(`${window.location.origin}/${rel}`);
  }

  return Array.from(candidates);
}

function installImageFallbacks(scope = document) {
  const imgs = scope.querySelectorAll('img');
  imgs.forEach((img) => {
    if (img.dataset.fallbackInstalled === '1') return;
    img.dataset.fallbackInstalled = '1';

    const original = img.getAttribute('src') || '';
    const candidates = buildImageUrlCandidates(original);
    if (candidates.length > 0) {
      img.setAttribute('src', candidates[0]);
    }

    let idx = 0;
    img.addEventListener('error', () => {
      idx += 1;
      if (idx < candidates.length) {
        img.src = candidates[idx];
        return;
      }
      const srcNow = img.getAttribute('src') || '';
      const isDiagramAsset = /\/diagrams\//i.test(original) || /\/diagrams\//i.test(srcNow);
      if (isDiagramAsset) {
        img.alt = (img.alt || 'Diagram') + ' (load failed)';
        img.style.minHeight = '120px';
        img.style.background = 'rgba(128,128,128,0.12)';
        return;
      }
      if (img.dataset.noInlineFallback === '1') {
        const wrap = img.closest('.josh-post-cover');
        if (wrap) wrap.remove();
        return;
      }
      img.src = buildInlineCoverDataUrl(img.dataset.fallbackTitle || img.alt || 'Tangentllm Notes');
    });
  });
}

    summary: item.summary || buildExcerptFromMarkdown(contentMarkdown),
    excerpt: item.excerpt || item.summary || buildExcerptFromMarkdown(contentMarkdown),
    architecture: Array.isArray(item.architecture) ? item.architecture : [],
    features: Array.isArray(item.features) ? item.features : [],
    metrics: Array.isArray(item.metrics) ? item.metrics : [],
    screenshots: Array.isArray(item.screenshots) ? item.screenshots : [],
    links: typeof item.links === 'object' && item.links
      ? item.links
      : { github: '#', demo: '#', docs: '#' },
    content: contentHtml,
    rawMarkdown: markdownText || '',
    updated: item.updated || item.period || '',
    readTime: item.readTime || estimateReadTimeFromMarkdown(contentMarkdown),
  };
}

function applyPostDerivedState() {
  const categoryCountMap = posts.reduce((acc, post) => {
    acc[post.category] = (acc[post.category] || 0) + 1;
    return acc;
  }, {});
  categories.forEach((cat) => {
    cat.count = categoryCountMap[cat.name] || 0;
  });

  posts.sort((a, b) => new Date(b.date) - new Date(a.date));

  const explicitPinned = new Set(
    posts.filter((post) => post.pinned).map((post) => post.slug),
  );
  if (explicitPinned.size === 0) {
    posts.forEach((post, idx) => {
      post.pinned = idx < 4;
    });
  } else {
    posts.forEach((post) => {
      if (!explicitPinned.has(post.slug)) post.pinned = false;
    });
    let pinSlots = explicitPinned.size;
    for (const post of posts) {
      if (pinSlots >= 4) break;
      if (!post.pinned) {
        post.pinned = true;
        pinSlots += 1;
      }
    }
  }
}

/**
 * 将同源 SVG 封面内联为 data URL，缓解子路径托管与部分环境对外链 SVG 作 <img> 时的兼容问题。
 * 拉取失败时保留原始 URL（由 installImageFallbacks 再尝试备选路径）。
 */
async function hydrateCoversSvgToDataUrls(items) {
  if (!items || !items.length) return;
  const urls = [
    ...new Set(
      items
        .map((it) => (typeof it.cover === 'string' ? it.cover.trim() : ''))
        .filter((u) => u && /\.svg(\?|#|$)/i.test(u) && !/^data:/i.test(u)),
    ),
  ];
  if (!urls.length) return;
  const pairs = await Promise.all(
    urls.map(async (url) => {
      try {
        const r = await fetch(url, { cache: 'no-store', credentials: 'omit' });
        if (!r.ok) return [url, null];
        let text = await r.text();
        text = text.replace(/^\uFEFF/, '');
        if (!/<\s*svg[\s>]/i.test(text)) return [url, null];
        const dataUrl = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(text)}`;
        return [url, dataUrl];
      } catch (_) {
        return [url, null];
      }
    }),
  );
  const map = new Map(pairs);
  items.forEach((it) => {
    const u = typeof it.cover === 'string' ? it.cover.trim() : '';
    const data = map.get(u);
    if (data) it.cover = data;
  });
}

async function loadPostsFromManifest() {
  const response = await fetch(resolveAssetUrl(postDataSource.manifestPath.replace(/^\.\//, '')), {
    cache: 'no-store',
  });
  if (!response.ok) {
    throw new Error(`manifest load failed: ${response.status}`);
  }

  const manifest = await response.json();
  if (!Array.isArray(manifest) || manifest.length === 0) {
    throw new Error('manifest empty');
  }

  const fetchedPosts = await Promise.all(
    manifest.map(async (item, index) => {
      if (!item.file) return normalizeLoadedPost(item, '', index);
      const markdownResponse = await fetch(resolveAssetUrl(String(item.file).replace(/^\.\//, '')), { cache: 'no-store' });
      const markdownText = markdownResponse.ok
        ? await markdownResponse.text()
        : '';
      const post = normalizeLoadedPost(item, markdownText, index);
      if (post.format === 'html' && post.htmlFile) {
        const htmlResponse = await fetch(resolveAssetUrl(String(post.htmlFile).replace(/^\.\//, '')), { cache: 'no-store' });
        if (htmlResponse.ok) {
          const html = await htmlResponse.text();
          if (typeof extractHtmlArticleProse === 'function') {
            post.content = extractHtmlArticleProse(html, post.title);
          } else {
            post.content = '';
          }
          if (!post.subtitle) {
            const subtitleMatch = html.match(/<p\s+class="subtitle"[^>]*>([^<]+)<\/p>/i);
            if (subtitleMatch) post.subtitle = subtitleMatch[1].trim();
          }
        } else {
          post.content = '';
        }
      }
      return post;
    }),
  );
  posts = fetchedPosts;
  applyPostDerivedState();
  await hydrateCoversSvgToDataUrls(posts);
}

async function loadProjectsFromManifest() {
  const response = await fetch(resolveAssetUrl(projectDataSource.manifestPath.replace(/^\.\//, '')), {
    cache: 'no-store',
  });
  if (!response.ok) {
    throw new Error(`project manifest load failed: ${response.status}`);
  }

  const manifest = await response.json();
  if (!Array.isArray(manifest) || manifest.length === 0) {
    throw new Error('project manifest empty');
  }

  const fetchedProjects = await Promise.all(
    manifest.map(async (item, index) => {
      const file = item.file;
      if (!file) return normalizeLoadedProject(item, '', index);
      const markdownResponse = await fetch(resolveAssetUrl(String(file).replace(/^\.\//, '')), { cache: 'no-store' });
      const markdownText = markdownResponse.ok
        ? await markdownResponse.text()
        : '';
      return normalizeLoadedProject(item, markdownText, index);
    }),
  );
  projectsData = fetchedProjects;
  // 作品封面保留绝对 SVG URL；内联 data URL 在部分路由下会导致 <img> 加载失败
}

function router() {
  let route = parseRoute();
  if (!JOSH_SHOW_PROJECTS && (route.type === 'projects' || route.type === 'project')) {
    history.replaceState(null, '', Routes.home());
    route = { type: 'home' };
  }
  const app = document.getElementById('app');
  if (typeof joshHomeCleanup === 'function') {
    joshHomeCleanup();
    joshHomeCleanup = null;
  }
  if (typeof joshSiteCleanup === 'function') {
    joshSiteCleanup();
    joshSiteCleanup = null;
  }
  if (typeof clearJoshReadingProgress === 'function') clearJoshReadingProgress();
  syncJoshSiteClass(route.type === 'home');

  // 解析路由
  if (route.type === 'home') {
    renderHome(app);
  } else if (route.type === 'post') {
    renderPost(app, route.slug);
  } else if (route.type === 'categories') {
    renderCategories(app);
  } else if (route.type === 'category') {
    renderCategoryPosts(app, route.name);
  } else if (route.type === 'tags') {
    renderTags(app);
  } else if (route.type === 'tag') {
    renderTagPosts(app, route.tag);
  } else if (route.type === 'projects') {
    renderProjects(app, route.query);
  } else if (route.type === 'project') {
    renderProjectDetail(app, route.slug);
  } else if (route.type === 'about') {
    renderAbout(app);
  } else {
    render404(app);
  }

  const isPostRoute = route.type === 'post';
  const isProjectRoute = route.type === 'project';
  const runImmediateEnhancements = () => {
    renderLucideIconsSafely();
    installImageFallbacks(app);
    initReveal();
    if ((isPostRoute || isProjectRoute) && typeof enhanceJoshProseCallouts === 'function') {
      enhanceJoshProseCallouts(app);
    }
  };
  const runDeferredEnhancements = () => {
    if ((isPostRoute || isProjectRoute) && typeof renderMathInElement === 'function') {
      renderMathInElement(app, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false });
    }
    if (isPostRoute || isProjectRoute) {
      renderMermaidDiagrams(app);
    }
    if (isPostRoute || isProjectRoute) {
      styleDetailsElements(app);
      runJoshPlaygroundMount(app);
      runJoshCodeHighlight(app);
    }
    if (isPostRoute || isProjectRoute) {
      initImageLightbox();
      if (typeof initJoshHeadingAnchors === 'function') initJoshHeadingAnchors(app);
      if (typeof initPostToc === 'function') initPostToc();
    }
    initLazyLoading();
  };
  requestAnimationFrame(runImmediateEnhancements);
  if (typeof requestIdleCallback === 'function') {
    requestIdleCallback(runDeferredEnhancements, { timeout: 120 });
  } else {
    setTimeout(runDeferredEnhancements, 30);
  }

  window.scrollTo({top: 0, behavior: 'instant'});
  // 添加页面切换动画
  app.classList.remove('page-transition');
  app.offsetHeight; // 强制重排
  app.classList.add('page-transition');
}

// 搜索（Josh 顶部下滑面板）
let joshSearchPlaceholderTimer = null;

function escapeSearchHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function highlightSearchText(text, query) {
  const safe = escapeSearchHtml(text);
  const trimmed = query.trim();
  if (!trimmed) return safe;
  const pattern = trimmed.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(`(${pattern})`, 'gi'), '<mark class="josh-search__mark">$1</mark>');
}

function buildSearchExcerpt(text, query) {
  const raw = String(text || '').trim();
  if (!raw) return '';
  const trimmed = query.trim();
  if (!trimmed) return escapeSearchHtml(raw);

  const lowerText = raw.toLowerCase();
  const lowerQuery = trimmed.toLowerCase();
  const matchIndex = lowerText.indexOf(lowerQuery);

  if (matchIndex === -1) {
    const snippet = raw.slice(0, 160);
    const prefixed = raw.length > snippet.length ? `…${snippet}…` : snippet;
    return highlightSearchText(prefixed, query);
  }

  const start = Math.max(0, matchIndex - 64);
  const end = Math.min(raw.length, matchIndex + trimmed.length + 96);
  let snippet = raw.slice(start, end);
  if (start > 0) snippet = `…${snippet}`;
  if (end < raw.length) snippet = `${snippet}…`;
  return highlightSearchText(snippet, query);
}

function joshSearchPlaceholderHints() {
  const hints = posts.slice(0, 12).map((p) => p.title);
  if (hints.length === 0) hints.push('Transformer', 'RAG', '微调');
  return hints;
}

function startSearchPlaceholderCycle() {
  stopSearchPlaceholderCycle();
  const input = document.getElementById('search-input');
  const hints = joshSearchPlaceholderHints();
  let index = 0;
  const tick = () => {
    if (!document.getElementById('search-overlay').classList.contains('open')) return;
    if (input.value.trim()) return;
    input.placeholder = hints[index % hints.length];
    index += 1;
  };
  tick();
  joshSearchPlaceholderTimer = window.setInterval(tick, 2400);
}

function stopSearchPlaceholderCycle() {
  if (joshSearchPlaceholderTimer) {
    clearInterval(joshSearchPlaceholderTimer);
    joshSearchPlaceholderTimer = null;
  }
}

function setSearchHasResults(hasResults) {
  const sheet = document.querySelector('.josh-search__sheet');
  if (sheet) sheet.dataset.hasResults = hasResults ? 'true' : 'false';
}

function renderSearchIntro() {
  const results = document.getElementById('search-results');
  results.innerHTML = JOSH_SHOW_PROJECTS
    ? '<p class="josh-search__intro">搜索本站所有文章与作品。</p>'
    : '<p class="josh-search__intro">搜索本站所有文章。</p>';
  setSearchHasResults(false);
}

function replaySearchEnterAnimations(overlay) {
  overlay.querySelectorAll('.josh-search__sheet, .josh-search__wave-svg').forEach((el) => {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  });
}

function collapseSearchWave(overlay) {
  const waveSvg = overlay.querySelector('.josh-search__wave-svg');
  if (!waveSvg) return;
  const initialX = getComputedStyle(waveSvg).getPropertyValue('--initial-x-scale').trim() || '0.8';
  waveSvg.style.animation = 'none';
  waveSvg.style.transition = 'transform 1s ease';
  waveSvg.style.transform = getComputedStyle(waveSvg).transform;
  void waveSvg.offsetWidth;
  waveSvg.style.transform = `scale(${initialX}, 0) translate(0)`;
}

function replayDismissOut(overlay) {
  const dismiss = overlay.querySelector('.josh-search__dismiss');
  if (!dismiss) return;
  dismiss.style.animation = 'none';
  void dismiss.offsetWidth;
  dismiss.style.removeProperty('animation');
}

function finishCloseSearch(overlay) {
  overlay.classList.remove('open', 'is-closing');
  overlay.dataset.closing = '';
  overlay.setAttribute('aria-hidden', 'true');
  stopSearchPlaceholderCycle();
  const input = document.getElementById('search-input');
  input.value = '';
  input.placeholder = '';
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.hidden = true;
  document.getElementById('search-results').innerHTML = '';
  setSearchHasResults(false);
  overlay.querySelectorAll('.josh-search__sheet, .josh-search__wave-svg, .josh-search__dismiss').forEach((el) => {
    el.style.animation = '';
    el.style.transform = '';
    el.style.transition = '';
  });
}

function openSearch() {
  const overlay = document.getElementById('search-overlay');
  if (overlay.classList.contains('open')) return;
  overlay.classList.remove('is-closing');
  overlay.dataset.closing = '';
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  replaySearchEnterAnimations(overlay);
  renderSearchIntro();
  startSearchPlaceholderCycle();
  setTimeout(() => document.getElementById('search-input').focus(), 80);
}

function closeSearch() {
  const overlay = document.getElementById('search-overlay');
  if (!overlay.classList.contains('open') || overlay.dataset.closing === 'true') return;
  overlay.dataset.closing = 'true';
  overlay.classList.add('is-closing');
  collapseSearchWave(overlay);
  replayDismissOut(overlay);
  window.setTimeout(() => overlay.classList.remove('open'), 32);
  window.setTimeout(() => finishCloseSearch(overlay), 750);
}

function handleSearchInput(input) {
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.hidden = !input.value;
  handleSearch(input.value);
}

function clearSearchInput() {
  const input = document.getElementById('search-input');
  input.value = '';
  document.getElementById('search-clear').hidden = true;
  handleSearch('');
  input.focus();
}

function handleSearch(query) {
  const results = document.getElementById('search-results');
  if (!query.trim()) {
    renderSearchIntro();
    return;
  }

  const q = query.toLowerCase();
  const matchedPosts = posts.filter(p =>
    p.title.toLowerCase().includes(q) ||
    p.tags.some(t => t.toLowerCase().includes(q)) ||
    p.excerpt.toLowerCase().includes(q) ||
    p.category.toLowerCase().includes(q)
  );
  const matchedProjects = JOSH_SHOW_PROJECTS ? projectsData.filter(project =>
    project.title.toLowerCase().includes(q) ||
    (project.subtitle || '').toLowerCase().includes(q) ||
    (project.summary || '').toLowerCase().includes(q) ||
    (project.tags || []).some(t => t.toLowerCase().includes(q)) ||
    (project.status || '').toLowerCase().includes(q) ||
    (project.period || '').toLowerCase().includes(q)
  ) : [];

  if (matchedPosts.length === 0 && matchedProjects.length === 0) {
    results.innerHTML = '<p class="josh-search__empty"><strong>没有找到结果。</strong> 抱歉，站内似乎没有相关内容！</p>';
    setSearchHasResults(true);
    return;
  }

  const postItems = matchedPosts.map((p) => `
    <article class="josh-search__article">
      <a href="${Routes.post(p.slug)}" onclick="closeSearch()" class="josh-search__hit">
        <span class="josh-search__hit-cat">${escapeSearchHtml(p.category)}</span>
        <p class="josh-search__hit-title">${highlightSearchText(p.title, query)}</p>
      </a>
      <p class="josh-search__hit-excerpt">${buildSearchExcerpt(p.excerpt, query)}</p>
    </article>
  `).join('');

  const projectItems = matchedProjects.map((project) => `
    <article class="josh-search__article">
      <a href="${Routes.project(project.slug)}" onclick="closeSearch()" class="josh-search__hit">
        <span class="josh-search__hit-cat">作品</span>
        <p class="josh-search__hit-title">${highlightSearchText(project.title, query)}</p>
      </a>
      <p class="josh-search__hit-excerpt">${buildSearchExcerpt(project.summary || project.subtitle || '', query)}</p>
    </article>
  `).join('');

  results.innerHTML = `${postItems}${projectItems}`;
  setSearchHasResults(true);
}

// 滚动渐显
function initReveal() {
  const pending = [...document.querySelectorAll('.reveal:not(.visible)')];
  if (pending.length === 0) return;

  const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
  pending.forEach((el) => {
    const rect = el.getBoundingClientRect();
    // 首屏可见元素立即显示，避免必须滚动才触发 observer
    if (rect.top < viewportHeight * 0.95 && rect.bottom > 0) {
      el.classList.add('visible');
    }
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.05, rootMargin: '0px 0px -8% 0px' });

  document.querySelectorAll('.reveal:not(.visible)').forEach((el) => observer.observe(el));
}

function updateArticleJsonLd(data, pageUrl, imageUrl) {
  const existing = document.getElementById('jsonld-article');
  if (existing) existing.remove();
  if (!data.article) return;

  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.id = 'jsonld-article';
  script.textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'BlogPosting',
    headline: data.article.headline || data.title,
    description: data.description,
    datePublished: data.article.datePublished || undefined,
    author: { '@type': 'Person', name: data.article.author || 'tangentllm' },
    image: imageUrl,
    inLanguage: 'zh-CN',
    mainEntityOfPage: { '@type': 'WebPage', '@id': pageUrl },
    url: pageUrl,
  });
  document.head.appendChild(script);
}

function updateMetaTag(attr, attrValue, content) {
  let tag = document.querySelector(`meta[${attr}="${attrValue}"]`);
  if (!tag) {
    tag = document.createElement('meta');
    tag.setAttribute(attr, attrValue);
    document.head.appendChild(tag);
  }
  tag.setAttribute('content', content);
}

// 获取相关推荐文章（基于标签匹配）
function getRelatedPosts(currentPost, limit = 3) {
  if (!currentPost || !currentPost.tags || currentPost.tags.length === 0) {
    return [];
  }

  // 计算每篇文章与当前文章的相关度
  const scored = posts
    .filter(p => p.slug !== currentPost.slug) // 排除当前文章
    .map(p => {
      let score = 0;

      // 1. 标签关联度分析（使用 Jaccard 相似度）
      const currentTags = new Set(currentPost.tags.map(t => t.toLowerCase()));
      const postTags = new Set(p.tags.map(t => t.toLowerCase()));
      const intersection = new Set([...currentTags].filter(x => postTags.has(x)));
      const union = new Set([...currentTags, ...postTags]);
      const jaccardSimilarity = intersection.size / union.size;
      score += jaccardSimilarity * 100; // 标签相似度权重最高

      // 2. 共同标签数量加分
      const commonTags = intersection.size;
      score += commonTags * 15;

      // 3. 同分类加分
      if (p.category === currentPost.category) {
        score += 20;
      }

      // 4. 同系列加分（如果有 series 字段）
      if (currentPost.series && p.series && currentPost.series === p.series) {
        score += 50;
      }

      // 5. 时间接近度加分（越新越好）
      const daysDiff = Math.abs(new Date(p.date) - new Date(currentPost.date)) / (1000 * 60 * 60 * 24);
      if (daysDiff < 30) score += 5;
      else if (daysDiff < 90) score += 3;
      else if (daysDiff < 180) score += 1;

      return {
        post: p,
        score,
        commonTags: Array.from(intersection),
        similarity: jaccardSimilarity
      };
    })
    .filter(item => item.score > 0) // 只保留有相关性的
    .sort((a, b) => b.score - a.score) // 按分数降序
    .slice(0, limit) // 取前 N 篇
    .map(item => ({
      ...item.post,
      _relatedMeta: {
        score: item.score,
        commonTags: item.commonTags,
        similarity: item.similarity
      }
    }));

  return scored;
}

// 浏览量统计（Supabase / 自建 HTTP + localStorage 回退）
const VIEW_STORAGE_KEY = 'tangentllm_notes_views';

function remoteCounterMode() {
  const su = typeof siteMeta.supabaseUrl === 'string' ? siteMeta.supabaseUrl.trim() : '';
  const sk = typeof siteMeta.supabaseAnonKey === 'string' ? siteMeta.supabaseAnonKey.trim() : '';
  if (su && sk) return 'supabase';
  const raw = siteMeta.viewCounterEndpoint;
  const base = typeof raw === 'string' ? raw.trim().replace(/\/$/, '') : '';
  if (base) return 'http';
  return null;
}

function viewCounterBase() {
  const raw = siteMeta.viewCounterEndpoint;
  return typeof raw === 'string' ? raw.trim().replace(/\/$/, '') : '';
}

function supabaseRestHeaders() {
  const key = String(siteMeta.supabaseAnonKey || '').trim();
  return {
    apikey: key,
    Authorization: `Bearer ${key}`,
    'Content-Type': 'application/json',
  };
}

/** PostgREST RPC 返回标量 bigint 时的解析 */
function parseRpcCountResponse(text) {
  const t = String(text || '').trim();
  try {
    const j = JSON.parse(t);
    if (typeof j === 'number' && Number.isFinite(j)) return j;
    if (Array.isArray(j) && j.length && typeof j[0] === 'number') return j[0];
  } catch (_) { /* empty */ }
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

async function postSupabaseViewHit(slug, kind) {
  const base = String(siteMeta.supabaseUrl || '').trim().replace(/\/$/, '');
  const url = `${base}/rest/v1/rpc/increment_page_view`;
  const r = await fetch(url, {
    method: 'POST',
    headers: supabaseRestHeaders(),
    body: JSON.stringify({ p_slug: slug, p_kind: kind }),
    mode: 'cors',
    cache: 'no-store',
  });
  const text = await r.text();
  if (!r.ok) return null;
  return parseRpcCountResponse(text);
}

async function fetchSupabaseViewCount(slug, kind) {
  const base = String(siteMeta.supabaseUrl || '').trim().replace(/\/$/, '');
  const url = `${base}/rest/v1/rpc/get_page_view`;
  const r = await fetch(url, {
    method: 'POST',
    headers: supabaseRestHeaders(),
    body: JSON.stringify({ p_slug: slug, p_kind: kind }),
    mode: 'cors',
    cache: 'no-store',
  });
  const text = await r.text();
  if (!r.ok) return null;
  return parseRpcCountResponse(text);
}

async function postRemoteViewHit(slug, kind) {
  const mode = remoteCounterMode();
  if (mode === 'supabase') return postSupabaseViewHit(slug, kind);
  const base = viewCounterBase();
  if (mode !== 'http' || !base) return null;
  const r = await fetch(`${base}/hit`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug, kind }),
    mode: 'cors',
    cache: 'no-store',
  });
  if (!r.ok) return null;
  const j = await r.json();
  return typeof j.count === 'number' ? j.count : null;
}

async function fetchRemoteViewCount(slug, kind) {
  const mode = remoteCounterMode();
  if (mode === 'supabase') return fetchSupabaseViewCount(slug, kind);
  const base = viewCounterBase();
  if (mode !== 'http' || !base) return null;
  const url = `${base}/count?slug=${encodeURIComponent(slug)}&kind=${encodeURIComponent(kind)}`;
  const r = await fetch(url, { mode: 'cors', cache: 'no-store' });
  if (!r.ok) return null;
  const j = await r.json();
  return typeof j.count === 'number' ? j.count : null;
}

function readLocalViewCount(slug, kind) {
  try {
    const stored = localStorage.getItem(VIEW_STORAGE_KEY);
    if (!stored) return 0;
    const viewData = JSON.parse(stored);
    const key = `${kind}:${slug}`;
    if (typeof viewData[key] === 'number') return viewData[key];
    if (kind === 'post' && typeof viewData[slug] === 'number') return viewData[slug];
  } catch (e) {
    console.error('读取浏览量数据失败:', e);
  }
  return 0;
}

function writeLocalViewCount(slug, kind, count) {
  try {
    const stored = localStorage.getItem(VIEW_STORAGE_KEY);
    let viewData = stored ? JSON.parse(stored) : {};
    if (typeof viewData !== 'object' || viewData === null) viewData = {};
    const key = `${kind}:${slug}`;
    viewData[key] = count;
    if (kind === 'post' && Object.prototype.hasOwnProperty.call(viewData, slug)) {
      delete viewData[slug];
    }
    localStorage.setItem(VIEW_STORAGE_KEY, JSON.stringify(viewData));
  } catch (e) {
    console.error('写入浏览量数据失败:', e);
  }
}

/** 同一会话内同一 slug 只计 1 次 PV（刷新不计）。全站共享计数需配置 Supabase 或自建 HTTP API */
function bumpLocalViewCount(slug, kind) {
  const sessionKey = `vc_seen_${kind}_${slug}`;
  const already = sessionStorage.getItem(sessionKey);
  let count = readLocalViewCount(slug, kind);
  if (!already) {
    sessionStorage.setItem(sessionKey, '1');
    count += 1;
    writeLocalViewCount(slug, kind, count);
  }
  return count;
}

async function bumpViewCount(slug, kind) {
  const sessionKey = `vc_seen_${kind}_${slug}`;
  const mode = remoteCounterMode();

  if (mode) {
    try {
      if (!sessionStorage.getItem(sessionKey)) {
        const remote = await postRemoteViewHit(slug, kind);
        if (remote != null) {
          sessionStorage.setItem(sessionKey, '1');
          writeLocalViewCount(slug, kind, remote);
          return remote;
        }
      } else {
        const cur = await fetchRemoteViewCount(slug, kind);
        if (cur != null) {
          writeLocalViewCount(slug, kind, cur);
          return cur;
        }
      }
    } catch (e) {
      console.warn('远程浏览量:', e);
    }
  }

  return bumpLocalViewCount(slug, kind);
}

/** 每条内容稳定注水 [100,5000]，仅影响展示；存储与远端仍为真实 PV */
const VIEW_DISPLAY_INFLATE_MIN = 100;
const VIEW_DISPLAY_INFLATE_MAX = 5000;

function stableViewInflateBoost(slug, kind) {
  const s = `${kind || 'post'}:${String(slug || '')}`;
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i += 1) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  const span = VIEW_DISPLAY_INFLATE_MAX - VIEW_DISPLAY_INFLATE_MIN + 1;
  return VIEW_DISPLAY_INFLATE_MIN + (h % span);
}

function displayViewCountValue(realCount, slug, kind = 'post') {
  const real = Math.max(0, Number(realCount) || 0);
  return real + stableViewInflateBoost(slug, kind);
}

function formatViewCount(n) {
  const v = Number(n) || 0;
  if (v >= 1000000) return `${(v / 1000000).toFixed(1).replace(/\.0$/, '')}M`;
  if (v >= 1000) return `${(v / 1000).toFixed(1).replace(/\.0$/, '')}k`;
  return String(v);
}

function setViewCountElement(elementId, rawCount, slug, kind = 'post') {
  const el = document.getElementById(elementId);
  if (!el) return;
  const textEl = el.querySelector('span');
  const shown =
    slug != null && String(slug).length
      ? displayViewCountValue(rawCount, slug, kind)
      : Math.max(0, Number(rawCount) || 0);
  const label = formatViewCount(shown);
  if (el.classList.contains('josh-post-meta__views')) {
    const text = `${label} 次阅读`;
    if (textEl) textEl.textContent = text;
    else el.textContent = text;
    const dot = document.getElementById(`view-count-dot-${slug}`);
    if (dot) dot.removeAttribute('hidden');
  } else if (el.classList.contains('josh-hit-counter') || el.classList.contains('josh-post-tail-stats__hits-value')) {
    const shown =
      slug != null && String(slug).length
        ? displayViewCountValue(rawCount, slug, kind)
        : Math.max(0, Number(rawCount) || 0);
    if (typeof updateJoshHitCounter === 'function') {
      updateJoshHitCounter(el, shown);
    } else {
      el.textContent = String(shown).padStart(6, '0');
    }
  } else if (textEl) {
    textEl.textContent = label;
  } else {
    el.textContent = label;
  }
  el.classList.remove('hidden');
}

async function updateViewCount(slug, kind = 'post') {
  try {
    const count = await bumpViewCount(slug, kind);
    setViewCountElement(`view-count-${slug}`, count, slug, kind);
    setViewCountElement(`view-count-tail-${slug}`, count, slug, kind);
  } catch (e) {
    console.warn('updateViewCount:', e);
    const fallback = readLocalViewCount(slug, kind);
    setViewCountElement(`view-count-${slug}`, fallback, slug, kind);
    setViewCountElement(`view-count-tail-${slug}`, fallback, slug, kind);
  }
}

function getViewCount(slug, kind = 'post') {
  return readLocalViewCount(slug, kind);
}

async function displayViewCount(slug, elementId, kind = 'post') {
  const mode = remoteCounterMode();
  let count = null;
  if (mode) {
    try {
      count = await fetchRemoteViewCount(slug, kind);
    } catch (e) {
      console.warn('拉取远程浏览量失败:', e);
    }
  }
  if (count === null || count === undefined) {
    count = readLocalViewCount(slug, kind);
  } else if (mode) {
    writeLocalViewCount(slug, kind, count);
  }
  setViewCountElement(elementId, count, slug, kind);
}

/** 同一 slug 多处展示：只拉取一次计数，更新多个 DOM（避免列表 mobile/desktop 重复请求） */
async function displayViewCountMulti(slug, kind, elementIds) {
  const ids = (elementIds || []).filter(Boolean);
  if (!ids.length) return;
  const mode = remoteCounterMode();
  let count = null;
  if (mode) {
    try {
      count = await fetchRemoteViewCount(slug, kind);
    } catch (e) {
      console.warn('拉取远程浏览量失败:', e);
    }
  }
  if (count === null || count === undefined) {
    count = readLocalViewCount(slug, kind);
  } else if (mode) {
    writeLocalViewCount(slug, kind, count);
  }
  ids.forEach((id) => setViewCountElement(id, count, slug, kind));
}

// 图片懒加载
function initLazyLoading() {
  if ('IntersectionObserver' in window) {
    const imageObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          const src = img.getAttribute('data-src');
          if (src) {
            img.src = src;
            img.removeAttribute('data-src');
          }
          observer.unobserve(img);
        }
      });
    }, {
      rootMargin: '50px'
    });

    document.querySelectorAll('img[data-src]').forEach(img => {
      imageObserver.observe(img);
    });
  } else {
    // 不支持 IntersectionObserver 时直接加载所有图片
    document.querySelectorAll('img[data-src]').forEach(img => {
      img.src = img.getAttribute('data-src');
      img.removeAttribute('data-src');
    });
  }
}

function runJoshCodeHighlight(scope = document) {
  const fallbackHljs = () => {
    if (typeof hljs === 'undefined') return;
    scope.querySelectorAll('.josh-prose pre code:not(.shiki code)').forEach((block) => {
      hljs.highlightElement(block);
    });
  };

  const finishCodeBlocks = () => {
    if (typeof joshWrapPlainCodeSnippets === 'function') {
      joshWrapPlainCodeSnippets(scope);
    } else {
      wrapCodeBlocks(scope);
    }
  };

  const tryShiki = async (attempt = 0) => {
    if (typeof highlightJoshProseCode === 'function') {
      const ok = await highlightJoshProseCode(scope);
      if (!ok) fallbackHljs();
      finishCodeBlocks();
      return;
    }
    if (attempt < 40) {
      setTimeout(() => { tryShiki(attempt + 1); }, 50);
      return;
    }
    fallbackHljs();
    finishCodeBlocks();
  };

  tryShiki();
}

function wrapCodeBlocks(scope = document) {
  const preTags = scope.querySelectorAll('.josh-prose pre:not(.josh-code-snippet pre), .prose pre:not(.code-block pre)');
  preTags.forEach(pre => {
    const code = pre.querySelector('code');
    if (!code) return;

    // 跳过已经被包装的
    if (pre.parentElement?.classList.contains('code-block')) return;

    // 获取语言类型
    const langMatch = code.className.match(/language-(\w+)/);
    const lang = langMatch ? langMatch[1] : 'text';

    // 创建包装器
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block';

    // 创建头部（只显示语言，不显示复制按钮）
    const header = document.createElement('div');
    header.className = 'code-header';
    header.innerHTML = `<span>${lang}</span>`;

    // 包装代码块
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
  });
}

function styleDetailsElements(scope = document) {
  const detailsElements = scope.querySelectorAll('.prose details, .josh-prose details');
  detailsElements.forEach(details => {
    if (!details.classList.contains('collapse-details')) {
      details.classList.add('collapse-details');
    }

    const summary = details.querySelector('summary');
    if (summary && !summary.classList.contains('collapse-summary')) {
      summary.classList.add('collapse-summary');

      // 添加展开/收起图标
      if (!summary.querySelector('.collapse-icon')) {
        const icon = document.createElement('span');
        icon.className = 'collapse-icon';
        icon.textContent = '▶';
        summary.insertBefore(icon, summary.firstChild);
      }
    }

    // 为 summary 之后的所有内容添加包装
    const children = Array.from(details.children);
    const summaryIndex = children.indexOf(summary);
    if (summaryIndex !== -1 && summaryIndex < children.length - 1) {
      // 检查是否已经有 collapse-content 包装
      const hasWrapper = children.some(child =>
        child.classList && child.classList.contains('collapse-content')
      );

      if (!hasWrapper) {
        const wrapper = document.createElement('div');
        wrapper.className = 'collapse-content';

        // 将 summary 之后的所有元素移到 wrapper 中
        for (let i = summaryIndex + 1; i < children.length; i++) {
          wrapper.appendChild(children[i]);
        }

        details.appendChild(wrapper);
      }
    }
  });
}

function renderMermaidDiagrams(scope = document) {
  if (typeof mermaid === 'undefined') return;
  if (!renderMermaidDiagrams.initialized) {
    mermaid.initialize({
      startOnLoad: false,
      theme: document.documentElement.classList.contains('dark') ? 'dark' : 'default',
      securityLevel: 'loose',
    });
    renderMermaidDiagrams.initialized = true;
  }

  const blocks = scope.querySelectorAll('pre code.language-mermaid');
  blocks.forEach((codeNode, idx) => {
    const pre = codeNode.closest('pre');
    if (!pre) return;
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.id = `mermaid-${Date.now()}-${idx}`;
    div.textContent = codeNode.textContent || '';
    pre.replaceWith(div);
  });

  const nodes = scope.querySelectorAll('.mermaid');
  if (nodes.length > 0) {
    mermaid.run({ nodes });
  }
}

// 文章 TOC 跟随（wt7fu6i / c1kp06zm）
function initPostToc() {
  const sidebar = document.getElementById('toc-sidebar');
  if (!sidebar) return;
  const links = sidebar.querySelectorAll('.josh-toc-link');
  if (links.length === 0) return;

  function setActive(link) {
    links.forEach((l) => l.classList.remove('active', 'is-active'));
    link.classList.add('active', 'is-active');
  }

  links.forEach((link) => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const targetId = link.dataset.target || link.getAttribute('href')?.slice(1);
      const target = targetId ? document.getElementById(targetId) : null;
      if (!target) return;

      const headerOffset = 112;
      const offsetPosition = target.getBoundingClientRect().top + window.pageYOffset - headerOffset;
      window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
      setActive(link);
    });
  });

  const observer = new IntersectionObserver((entries) => {
    const intersectingEntries = entries.filter((entry) => entry.isIntersecting);
    if (intersectingEntries.length === 0) return;

    const topmost = intersectingEntries.reduce((prev, curr) =>
      curr.boundingClientRect.top < prev.boundingClientRect.top ? curr : prev
    );

    const active = sidebar.querySelector(`[data-target="${topmost.target.id}"]`);
    if (active) setActive(active);
  }, { rootMargin: '-112px 0px -70% 0px' });

  links.forEach((link) => {
    const targetId = link.dataset.target || link.getAttribute('href')?.slice(1);
    const target = targetId ? document.getElementById(targetId) : null;
    if (target) observer.observe(target);
  });

  setTimeout(() => {
    const activeLink = sidebar.querySelector('.josh-toc-link.active');
    if (activeLink) {
      setActive(activeLink);
    } else if (links.length > 0) {
      setActive(links[0]);
    }
  }, 100);
}

// 复制代码
function copyCode(btn) {
  const code = btn.closest('.code-block').querySelector('code');
  navigator.clipboard.writeText(code.textContent).then(() => {
    const orig = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openSearch();
    return;
  }
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); openSearch();
  }
  if (e.key === 'Escape') {
    closeSearch();
    closeImageLightbox();
  }
});

// 滚动监听
let isScrollScheduled = false;
window.addEventListener('scroll', () => {
  if (isScrollScheduled) return;
  isScrollScheduled = true;
  requestAnimationFrame(() => {
    updateProgressBar();
    isScrollScheduled = false;
  });
}, { passive: true });

// 路由监听（History API + 旧 Hash 兼容）
window.addEventListener('popstate', router);
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
  const href = a.getAttribute('href');
  if (!href || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
  if (href.startsWith('#') && !href.startsWith('#/')) return;
  const base = getSiteBasePath();
  const isInternal = (base && href.startsWith(base)) || href.startsWith('/weblog');
  if (!isInternal) return;
  e.preventDefault();
  history.pushState(null, '', href);
  router();
});
window.addEventListener('load', () => {
  // 避免首次打开时图标脚本晚到导致漏渲染
  renderLucideIconsSafely();
  // 隐藏初始加载动画
  hideLoader();
});

// 初始化
async function initApp() {
  migrateHashToHistory();
  applySiteVerificationMeta();
  initTheme();
  try {
    await loadPostsFromManifest();
  } catch (error) {
    if (!postDataSource.fallbackToEmbedded) {
      posts = [];
    }
    applyPostDerivedState();
    console.log('文章自动加载失败，回退内置数据。', error);
  }
  try {
    await loadProjectsFromManifest();
  } catch (error) {
    if (!projectDataSource.fallbackToEmbedded) {
      projectsData = [];
    }
    console.log('作品自动加载失败，回退内置数据。', error);
  }
  router();
  hideLoader();
}

initApp();
