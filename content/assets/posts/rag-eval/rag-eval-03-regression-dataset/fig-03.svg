<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width:1000px;">
        <defs>
          <marker id="arw4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8433a"></path>
          </marker>
          <marker id="arw5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f58"></path>
          </marker>
        </defs>

        <!-- 时间轴基线 -->
        <line x1="60" y1="290" x2="940" y2="290" stroke="#c8c3b8" stroke-width="2"></line>
        <text x="940" y="310" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#8a8f98">TIME →</text>

        <!-- Dataset versions -->
        <g font-family="Inter, sans-serif">
          <!-- v1.0 -->
          <circle cx="140" cy="290" r="8" fill="#4a4f58"></circle>
          <text x="140" y="318" text-anchor="middle" font-size="11.5" fill="#16181d" font-weight="600">v1.0.0</text>
          <text x="140" y="334" text-anchor="middle" font-size="10" fill="#8a8f98">120 cases</text>

          <!-- v1.1 -->
          <circle cx="320" cy="290" r="8" fill="#4a4f58"></circle>
          <text x="320" y="318" text-anchor="middle" font-size="11.5" fill="#16181d" font-weight="600">v1.1.0</text>
          <text x="320" y="334" text-anchor="middle" font-size="10" fill="#8a8f98">150 cases</text>

          <!-- v1.2 -->
          <circle cx="540" cy="290" r="10" fill="#b8433a"></circle>
          <text x="540" y="318" text-anchor="middle" font-size="11.5" fill="#b8433a" font-weight="700">v1.2.0</text>
          <text x="540" y="334" text-anchor="middle" font-size="10" fill="#8a8f98">200 cases · CURRENT</text>

          <!-- v1.3 (future) -->
          <circle cx="770" cy="290" r="8" fill="#c8c3b8" stroke="#8a8f98" stroke-dasharray="3,2"></circle>
          <text x="770" y="318" text-anchor="middle" font-size="11.5" fill="#8a8f98" font-weight="600">v1.3.0</text>
          <text x="770" y="334" text-anchor="middle" font-size="10" fill="#8a8f98">+ new failures</text>
        </g>

        <!-- 版本间演进箭头 -->
        <line x1="150" y1="290" x2="310" y2="290" stroke="#b8433a" stroke-width="1.5" marker-end="url(#arw4)"></line>
        <line x1="330" y1="290" x2="528" y2="290" stroke="#b8433a" stroke-width="1.5" marker-end="url(#arw4)"></line>
        <line x1="552" y1="290" x2="760" y2="290" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arw5)"></line>

        <!-- 每次版本的因果说明 -->
        <g font-family="Inter, sans-serif" font-size="10.5" fill="#4a4f58">
          <!-- v1.0 to v1.1 -->
          <path d="M 200 285 Q 230 180 290 200" fill="none" stroke="#c8c3b8" stroke-width="1" stroke-dasharray="3,3"></path>
          <rect x="150" y="150" width="180" height="60" rx="8" fill="#e8eef6" stroke="#b3c6dc"></rect>
          <text x="160" y="172" font-size="11" fill="#2d5a8e" font-weight="600">+ Production Query × 30</text>
          <text x="160" y="190" font-size="10" fill="#4a4f58">分布对齐，分数微调</text>

          <!-- v1.1 to v1.2 -->
          <path d="M 420 285 Q 460 180 510 200" fill="none" stroke="#c8c3b8" stroke-width="1" stroke-dasharray="3,3"></path>
          <rect x="370" y="140" width="230" height="72" rx="8" fill="#f6e8e6" stroke="#d8a5a0"></rect>
          <text x="380" y="162" font-size="11" fill="#b8433a" font-weight="600">+ Failure → Regression × 18</text>
          <text x="380" y="180" font-size="10" fill="#4a4f58">3 月 12 日退款事故转化入库</text>
          <text x="380" y="198" font-size="10" fill="#8a8f98">历史基准需 re-run 才可比</text>

          <!-- v1.2 to v1.3 -->
          <rect x="620" y="150" width="230" height="60" rx="8" fill="#faf0dc" stroke="#d4b98a"></rect>
          <text x="630" y="172" font-size="11" fill="#a3701c" font-weight="600">下一轮：Adversarial × 15</text>
          <text x="630" y="190" font-size="10" fill="#4a4f58">红队扫描新发现的越狱路径</text>
          <path d="M 735 210 Q 760 250 770 280" fill="none" stroke="#c8c3b8" stroke-width="1" stroke-dasharray="3,3"></path>
        </g>

        <!-- 顶部标题 -->
        <text x="500" y="35" text-anchor="middle" font-family="Playfair Display, serif" font-size="18" font-weight="700" fill="#16181d" letter-spacing="0.5">
          Regression Dataset 的版本演进
        </text>
        <text x="500" y="55" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8a8f98" letter-spacing="1.5">
          不同 dataset 版本上的评测分数不可直接比较 —— 需通过 baseline re-run 重建可比性
        </text>

        <!-- 关键原则卡 -->
        <rect x="290" y="352" width="420" height="24" rx="12" fill="#16181d"></rect>
        <text x="500" y="368" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#fbfaf7" font-weight="500" letter-spacing="1">
          DATASET VERSION = 评测可比性的唯一坐标
        </text>
      </svg>