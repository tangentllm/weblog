<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang SC,sans-serif">
          <!-- Axes -->
          <line x1="380" y1="50" x2="380" y2="360" stroke="#52606d" stroke-width="1.6"></line>
          <line x1="60" y1="205" x2="700" y2="205" stroke="#52606d" stroke-width="1.6"></line>
          <text x="380" y="40" text-anchor="middle" font-size="12" fill="#1a7f5a" font-weight="700">Answer Faithful ↑</text>
          <text x="380" y="378" text-anchor="middle" font-size="12" fill="#7b8794">Answer Faithful ↓</text>
          <text x="70" y="200" text-anchor="start" font-size="12" fill="#1e5f8c" font-weight="700">← Context 错误/缺失</text>
          <text x="690" y="200" text-anchor="end" font-size="12" fill="#1e5f8c" font-weight="700">Context 正确 →</text>

          <!-- Q4 top-right: good -->
          <rect x="395" y="60" width="290" height="130" rx="8" fill="#eaf6f0" stroke="#1a7f5a" stroke-width="1.2"></rect>
          <text x="540" y="88" text-anchor="middle" font-size="14" fill="#1a7f5a" font-weight="700">✓ 理想状态</text>
          <text x="540" y="112" text-anchor="middle" font-size="12" fill="#52606d">Context 正确 · Answer 忠实</text>
          <text x="540" y="134" text-anchor="middle" font-size="12" fill="#52606d">= 通常也是 Correct</text>
          <text x="540" y="160" text-anchor="middle" font-size="11" fill="#7b8794" font-style="italic">这是我们唯一想停留的象限</text>

          <!-- Q1 top-left: case B -->
          <rect x="75" y="60" width="290" height="130" rx="8" fill="#fdf3e3" stroke="#b45309" stroke-width="1.2"></rect>
          <text x="220" y="88" text-anchor="middle" font-size="14" fill="#b45309" font-weight="700">⚠ Case B</text>
          <text x="220" y="112" text-anchor="middle" font-size="12" fill="#52606d">Context 过期/错误 · Answer 忠实</text>
          <text x="220" y="134" text-anchor="middle" font-size="12" fill="#52606d">Faithfulness 高 · Correctness 低</text>
          <text x="220" y="160" text-anchor="middle" font-size="11" fill="#7b8794" font-style="italic">Faithfulness 静默，需要 Context 层指标兜底</text>

          <!-- Q3 bottom-right: case A -->
          <rect x="395" y="220" width="290" height="130" rx="8" fill="#fbecec" stroke="#b03a3a" stroke-width="1.2"></rect>
          <text x="540" y="248" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="700">✗ Case A</text>
          <text x="540" y="272" text-anchor="middle" font-size="12" fill="#52606d">Context 正确 · Answer 幻觉</text>
          <text x="540" y="294" text-anchor="middle" font-size="12" fill="#52606d">Faithfulness 低 · Correctness 低</text>
          <text x="540" y="320" text-anchor="middle" font-size="11" fill="#7b8794" font-style="italic">Faithfulness 是唯一的报警器</text>

          <!-- Q2 bottom-left: worst -->
          <rect x="75" y="220" width="290" height="130" rx="8" fill="#f5f1ea" stroke="#52606d" stroke-width="1.2"></rect>
          <text x="220" y="248" text-anchor="middle" font-size="14" fill="#52606d" font-weight="700">✗✗ 最坏组合</text>
          <text x="220" y="272" text-anchor="middle" font-size="12" fill="#52606d">Context 错 · Answer 又幻觉</text>
          <text x="220" y="294" text-anchor="middle" font-size="12" fill="#52606d">两层同时失败</text>
          <text x="220" y="320" text-anchor="middle" font-size="11" fill="#7b8794" font-style="italic">必须靠多层指标交叉定位</text>

          <text x="380" y="400" text-anchor="middle" font-size="11.5" fill="#7b8794" font-style="italic">Faithfulness 只区分“上下 / 不区分左右”——所以它必须有 Context 指标 + Correctness 类指标配合才有意义</text>
        </svg>