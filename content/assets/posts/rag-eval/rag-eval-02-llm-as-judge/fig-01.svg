<svg viewBox="0 0 920 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC',sans-serif">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#B4531E"></path>
        </marker>
        <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#16405B"></path>
        </marker>
      </defs>
      <!-- 输入层 -->
      <text x="30" y="34" font-size="11" fill="#7A8A9A" letter-spacing="2">INPUT · 一次 Evaluation Case 的四个字段</text>
      <g font-size="13" fill="#16405B" font-weight="600">
        <rect x="30" y="48" width="98" height="34" rx="17" fill="#fff" stroke="#E3DDD2"></rect><text x="79" y="70" text-anchor="middle">Question</text>
        <rect x="140" y="48" width="88" height="34" rx="17" fill="#fff" stroke="#E3DDD2"></rect><text x="184" y="70" text-anchor="middle">Context</text>
        <rect x="240" y="48" width="84" height="34" rx="17" fill="#fff" stroke="#E3DDD2"></rect><text x="282" y="70" text-anchor="middle">Answer</text>
        <rect x="336" y="48" width="98" height="34" rx="17" fill="#fff" stroke="#E3DDD2"></rect><text x="385" y="70" text-anchor="middle">Reference</text>
      </g>
      <text x="30" y="66" font-size="14"> </text>
      <!-- 汇聚箭头 -->
      <path d="M120,92 L120,118 L440,118 L440,148" fill="none" stroke="#16405B" stroke-width="1.5" marker-end="url(#arrB)"></path>
      <path d="M184,92 L184,110 L440,110 L440,148" fill="none" stroke="#16405B" stroke-width="1.5"></path>
      <path d="M282,92 L282,102 L440,102 L440,148" fill="none" stroke="#16405B" stroke-width="1.5" marker-end="url(#arrB)"></path>
      <path d="M385,92 L440,148" fill="none" stroke="#16405B" stroke-width="1.5"></path>
      <!-- 阶段1 提取 -->
      <rect x="330" y="150" width="220" height="56" rx="10" fill="#F5E3D7" stroke="#B4531E" stroke-width="1.5"></rect>
      <text x="440" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#8A3A10">① Claim Extraction</text>
      <text x="440" y="194" text-anchor="middle" font-size="11.5" fill="#8A3A10">Answer → 原子化陈述列表</text>
      <!-- 阶段2 逐条验证 -->
      <path d="M440,206 L440,236" fill="none" stroke="#B4531E" stroke-width="1.5" marker-end="url(#arr)"></path>
      <rect x="300" y="240" width="280" height="60" rx="10" fill="#DCE8F0" stroke="#16405B" stroke-width="1.5"></rect>
      <text x="440" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#16405B">② Per-Claim Verification</text>
      <text x="440" y="285" text-anchor="middle" font-size="11.5" fill="#3A5A74">每条 Claim × Context 独立判定 supported / unsupported</text>
      <!-- 右侧：Rubric 输入 -->
      <rect x="660" y="150" width="220" height="56" rx="10" fill="#fff" stroke="#C9B694" stroke-dasharray="5 4"></rect>
      <text x="770" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8A6A2F">Scoring Rubric</text>
      <text x="770" y="194" text-anchor="middle" font-size="11.5" fill="#8A6A2F">评分标准 + 判例，跨版本冻结</text>
      <path d="M660,178 L582,178" fill="none" stroke="#C9B694" stroke-width="1.5" marker-end="url(#arrB)" stroke-dasharray="5 4"></path>
      <path d="M770,206 L770,270 L582,270" fill="none" stroke="#C9B694" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrB)"></path>
      <!-- 阶段3 聚合 -->
      <path d="M580,270 L640,270" fill="none" stroke="none"></path>
      <!-- 底部阶段 -->
      <g>
        <rect x="90" y="150" width="200" height="56" rx="10" fill="#F5E3D7" stroke="#B4531E" stroke-width="1.5"></rect>
        <text x="190" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#8A3A10">③ Score Aggregation</text>
        <text x="190" y="194" text-anchor="middle" font-size="11.5" fill="#8A3A10">Claim 级 → Case 级分数</text>
      </g>
      <path d="M300,270 L190,270 L190,206" fill="none" stroke="#B4531E" stroke-width="1.5" marker-end="url(#arr)"></path>
      <path d="M300,262 L296,258" fill="none" stroke="none"></path>
      <!-- 阶段4 结构化输出 -->
      <path d="M190,150 L190,132 L440,132 L440,148" fill="none" stroke="#16405B" stroke-width="1.5" transform="translate(0,0)"></path>
      <!-- 输出卡 -->
      <g>
        <rect x="620" y="240" width="280" height="76" rx="10" fill="#18222E"></rect>
        <text x="648" y="266" font-size="12.5" font-weight="700" fill="#E3B455" font-family="'JetBrains Mono',monospace">④ Structured Output</text>
        <text x="648" y="290" font-size="12" fill="#D8E1EA" font-family="'JetBrains Mono',monospace">{ score, verdicts[], evidence, reason }</text>
        <text x="648" y="306" font-size="10.5" fill="#5E7387" font-family="'JetBrains Mono',monospace">JSON Schema 强约束 · 可直接入库</text>
      </g>
      <path d="M580,270 L618,270" fill="none" stroke="#16405B" stroke-width="1.5" marker-end="url(#arrB)"></path>
      <!-- ⑤ 元层 -->
      <rect x="90" y="240" width="180" height="76" rx="10" fill="#fff" stroke="#B03A2E" stroke-width="1.5" stroke-dasharray="6 4"></rect>
      <text x="180" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#B03A2E">⑤ Judge Meta-Eval</text>
      <text x="180" y="290" text-anchor="middle" font-size="11" fill="#B03A2E">Judge 本身也要被评测</text>
      <text x="180" y="306" text-anchor="middle" font-size="10" fill="#B03A2E">（第 04 节展开）</text>
      <path d="M270,270 L298,270" fill="none" stroke="#B03A2E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" transform="translate(0,0)"></path>
    </svg>