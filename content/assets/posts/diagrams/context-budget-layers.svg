<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">Single-turn prompt token budget layers</title>
  <desc id="desc">Stacked bar: system, summary, retrieved memory, recent turns, current user input within context limit.</desc>
  <rect width="560" height="300" fill="#f8fafc" rx="8"/>
  <text x="280" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Prompt budget per request (example 32k window)</text>
  <rect x="40" y="200" width="480" height="36" fill="#e2e8f0" rx="4"/>
  <text x="280" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">context limit</text>
  <rect x="40" y="200" width="72" height="36" fill="#1e293b" rx="4"/>
  <text x="76" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#fff">system</text>
  <rect x="112" y="200" width="96" height="36" fill="#6366f1" rx="0"/>
  <text x="160" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#fff">summary</text>
  <rect x="208" y="200" width="120" height="36" fill="#2563eb" rx="0"/>
  <text x="268" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#fff">retrieved</text>
  <rect x="328" y="200" width="128" height="36" fill="#3b82f6" rx="0"/>
  <text x="392" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#fff">recent k turns</text>
  <rect x="456" y="200" width="64" height="36" fill="#60a5fa" rx="4"/>
  <text x="488" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#0f172a">user</text>
  <text x="40" y="255" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Reserve headroom for model output (completion tokens)</text>
  <text x="40" y="275" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">Keep system stable; append new turns only (no in-place edits)</text>
</svg>
