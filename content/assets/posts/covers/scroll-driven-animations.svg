<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="滚动驱动动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0d4ee"/>
      <stop offset="100%" stop-color="#7dc4e8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4242fa"/>
      <stop offset="100%" stop-color="#809fff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect x="120" y="420" width="960" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
  <rect x="120" y="420" width="420" height="8" rx="4" fill="url(#bar)"/>
  <rect x="300" y="180" width="180" height="180" rx="16" fill="#ffcc66" opacity="0.95"/>
  <rect x="620" y="240" width="120" height="120" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="120" y="120" font-family="system-ui,sans-serif" font-size="54" font-weight="700" fill="#0a0c10">Scroll-Driven Animations</text>
  <text x="120" y="175" font-family="system-ui,sans-serif" font-size="28" fill="#262d40">animation-timeline · view() · scroll()</text>
